<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Update the title of the page to "User Data"-->
    <title>User Data</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="topbar">
        <h1 class="sr-only">User Data</h1>
        <!-- Add a link to the responsive.html page with the text "Responsive" and the id "responsive" -->
        <a id="responsive" href="responsive.html" class="link-responsive">Responsive</a>
    </header>

    <main class="container">
        <button id="getDataButton" class="btn">Get User Data</button>

        <table id="userData">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Website</th>
                    <th>Company</th>
                    <th>Address</th>
                </tr>
            </thead>
            <!-- Table body will be dynamically filled by script.js -->
            <tbody></tbody>
        </table>
    </main>

    <script src="script.js"></script>
</body>

</html>
