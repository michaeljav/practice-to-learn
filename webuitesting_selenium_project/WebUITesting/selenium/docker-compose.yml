version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: app-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
