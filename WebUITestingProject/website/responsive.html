<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Responsive Border Container</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .border-container {
            box-sizing: border-box;
            border: 1px solid #000;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .content {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="border-container">
        <div class="content">
            <p>This is a responsive border container.</p>
            <p><a href="index.html">← Back</a></p>
        </div>
    </div>
</body>

</html>
