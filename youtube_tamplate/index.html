<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoTube</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --text: #0f0f0f;
      --secondary-text: #606060;
      --header-bg: rgba(255, 255, 255, 0.96);
      --hover: #f2f2f2;
      --chip-bg: #f2f2f2;
      --border: #d3d3d3;
      --sidebar-width: 240px;
    }

    body.dark {
      --bg: #0f0f0f;
      --text: #f1f1f1;
      --secondary-text: #aaaaaa;
      --header-bg: rgba(15, 15, 15, 0.96);
      --hover: #272727;
      --chip-bg: #272727;
      --border: #303030;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    button,
    input {
      font-family: inherit;
    }

    /* HEADER */

    .header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
    }

    .header-left {
      gap: 18px;
    }

    .menu-btn {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .menu-btn:hover {
      background: var(--hover);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
    }

    .logo-icon {
      width: 30px;
      height: 21px;
      background: #ff0000;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-icon::after {
      content: "";
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid white;
      margin-left: 2px;
    }

    .header-center {
      flex: 1;
      justify-content: center;
      max-width: 720px;
      margin: 0 30px;
    }

    .search-container {
      display: flex;
      width: 100%;
    }

    .search-container input {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 20px 0 0 20px;
      padding: 0 18px;
      font-size: 16px;
      outline: none;
      background: var(--bg);
      color: var(--text);
    }

    .search-container input:focus {
      border-color: #1c62b9;
      box-shadow: inset 1px 0 #1c62b9;
    }

    .search-btn {
      width: 64px;
      border: 1px solid var(--border);
      border-radius: 0 20px 20px 0;
      background: var(--hover);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
    }

    .mic-btn {
      min-width: 40px;
      width: 40px;
      height: 40px;
      margin-left: 12px;
      border: none;
      border-radius: 50%;
      background: var(--hover);
      cursor: pointer;
      color: var(--text);
      font-size: 17px;
    }

    .header-right {
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      font-size: 19px;
    }

    .icon-btn:hover {
      background: var(--hover);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #7b2ff7, #00c6ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* SIDEBAR */

    .sidebar {
      width: var(--sidebar-width);
      position: fixed;
      top: 56px;
      left: 0;
      bottom: 0;
      padding: 12px;
      overflow-y: auto;
      background: var(--bg);
      transition: width 0.2s, transform 0.2s;
      z-index: 900;
    }

    .sidebar.collapsed {
      width: 74px;
    }

    .sidebar-section {
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-item {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 12px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar-item:hover {
      background: var(--hover);
    }

    .sidebar-item.active {
      background: var(--hover);
      font-weight: 600;
    }

    .sidebar-icon {
      min-width: 24px;
      font-size: 19px;
      text-align: center;
    }

    .sidebar.collapsed .sidebar-text {
      display: none;
    }

    .sidebar-title {
      padding: 6px 12px 10px;
      font-weight: 600;
    }

    .sidebar.collapsed .sidebar-title {
      display: none;
    }

    /* MAIN */

    .main {
      margin-left: var(--sidebar-width);
      padding-top: 56px;
      min-height: 100vh;
      transition: margin-left 0.2s;
    }

    .main.expanded {
      margin-left: 74px;
    }

    /* CATEGORIES */

    .categories-wrapper {
      position: sticky;
      top: 56px;
      z-index: 100;
      background: var(--header-bg);
      padding: 12px 20px;
      overflow: hidden;
    }

    .categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      border: none;
      border-radius: 8px;
      background: var(--chip-bg);
      color: var(--text);
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .category:hover {
      filter: brightness(0.95);
    }

    .category.active {
      background: var(--text);
      color: var(--bg);
    }

    /* VIDEOS */

    .content {
      padding: 24px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 34px 18px;
    }

    .video-card {
      cursor: pointer;
      min-width: 0;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #ddd;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s;
    }

    .video-card:hover .thumbnail img {
      transform: scale(1.03);
    }

    .duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 3px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .video-info {
      display: flex;
      gap: 12px;
      padding-top: 12px;
    }

    .channel-avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .video-details {
      min-width: 0;
      flex: 1;
    }

    .video-title {
      font-size: 16px;
      line-height: 1.35;
      font-weight: 600;
      margin-bottom: 7px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .channel-name,
    .video-stats {
      color: var(--secondary-text);
      font-size: 14px;
      line-height: 1.4;
    }

    .more-btn {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      height: 30px;
    }

    /* EMPTY */

    .no-results {
      display: none;
      text-align: center;
      padding: 80px 20px;
      color: var(--secondary-text);
    }

    .no-results h2 {
      color: var(--text);
      margin-bottom: 10px;
    }

    /* VIDEO MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 2000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #000;
      width: min(1000px, 95vw);
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
    }

    .modal-content img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.72;
    }

    .fake-player {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .big-play {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 0, 0, 0.9);
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.6);
      color: white;
    }

    /* RESPONSIVE */

    @media (max-width: 1300px) {
      .video-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 1000px) {
      .sidebar {
        width: 74px;
      }

      .sidebar .sidebar-text,
      .sidebar .sidebar-title {
        display: none;
      }

      .main {
        margin-left: 74px;
      }

      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .header {
        padding: 0 8px;
      }

      .logo span {
        display: none;
      }

      .header-center {
        margin: 0 6px;
      }

      .mic-btn,
      .upload-btn {
        display: none;
      }

      .sidebar {
        transform: translateX(-100%);
        width: 240px;
      }

      .sidebar.mobile-open {
        transform: translateX(0);
      }

      .sidebar.mobile-open .sidebar-text,
      .sidebar.mobile-open .sidebar-title {
        display: block;
      }

      .main,
      .main.expanded {
        margin-left: 0;
      }

      .content {
        padding: 16px 10px;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }

      .categories-wrapper {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="header-left">

<main class="main" id="main">

  <div class="categories-wrapper">

    <div class="categories" id="categories">

      <button class="category active" data-category="Todos">

      <button class="category" data-category="Programación">

      <button class="category" data-category="JavaScript">

      <button class="category" data-category="Música">

      <button class="category" data-category="Tecnología">

  <section class="content">

    <div class="video-grid" id="videoGrid"></div>

    <div class="no-results" id="noResults">
      <h2>No encontramos videos</h2>
      <p>Intenta buscar otra cosa.</p>

</main>


<div class="modal" id="videoModal">

  <div class="modal-content">

    <button class="close-modal" id="closeModal">
      ✕
    </button>

    <img id="modalImage" alt="Video" />

    <div class="fake-player">
      <button class="big-play">▶</button>
    </div>

</div>


<script>

  const videos = [
    {

    {

      duration: "28:43",
      category: "Programación",
      thumbnail: "https://picsum.photos/seed/webdev/640/360",

    },
    {

      views: "5.6 M de vistas",

    },
    {

      channel: "CSS Master",
      views: "703 k vistas",
      time: "hace 6 días",
      duration: "14:28",
      category: "Programación",
      thumbnail: "https://picsum.photos/seed/css/640/360",

    },
    {
      title: "Noticias importantes del mundo tecnológico",
      channel: "Tech News",
      views: "986 k vistas",
      time: "hace 2 horas",
      duration: "11:45",
      category: "Noticias",
      thumbnail: "https://picsum.photos/seed/news/640/360",
      avatar: "https://i.pravatar.cc/100?img=18"
    },
    {

      views: "342 k vistas",
      time: "hace 4 semanas",
      duration: "34:20",
      category: "Diseño",

    },
    {
      title: "Cómo funciona Node.js realmente",
      channel: "Backend School",
      views: "1.8 M de vistas",
      time: "hace 7 meses",
      duration: "26:50",
      category: "Programación",
      thumbnail: "https://picsum.photos/seed/nodejs/640/360",
      avatar: "https://i.pravatar.cc/100?img=20"
    },
    {
      title: "Creando un dashboard profesional con React",
      channel: "React World",
      views: "645 k vistas",
      time: "hace 12 días",
      duration: "48:32",
      category: "React",
      thumbnail: "https://picsum.photos/seed/dashboard/640/360",
      avatar: "https://i.pravatar.cc/100?img=21"
    },
    {
      title: "Setup perfecto para desarrolladores",
      channel: "Developer Life",
      views: "2.3 M de vistas",
      time: "hace 3 meses",
      duration: "17:42",
      category: "Tecnología",
      thumbnail: "https://picsum.photos/seed/setup/640/360",
      avatar: "https://i.pravatar.cc/100?img=22"
    }
  ];


  const videoGrid = document.getElementById("videoGrid");
  const searchInput = document.getElementById("searchInput");
  const searchBtn = document.getElementById("searchBtn");

  const sidebar = document.getElementById("sidebar");
  const main = document.getElementById("main");
  const menuBtn = document.getElementById("menuBtn");

  const themeBtn = document.getElementById("themeBtn");

  const modal = document.getElementById("videoModal");
  const modalImage = document.getElementById("modalImage");
  const closeModal = document.getElementById("closeModal");

  const noResults = document.getElementById("noResults");

  let selectedCategory = "Todos";


  function renderVideos() {

    const searchValue = searchInput.value
      .trim()
      .toLowerCase();


    const filteredVideos = videos.filter(video => {

      const matchesSearch =
        video.title.toLowerCase().includes(searchValue) ||
        video.channel.toLowerCase().includes(searchValue);

      const matchesCategory =
        selectedCategory === "Todos" ||
        video.category === selectedCategory;

      return matchesSearch && matchesCategory;

    });


    videoGrid.innerHTML = "";


    filteredVideos.forEach(video => {

      const card = document.createElement("article");

      card.className = "video-card";


      card.innerHTML = `

        <div class="thumbnail">

          <img
            src="${video.thumbnail}"
            alt="${video.title}"
          />

          <span class="duration">
            ${video.duration}
          </span>

        </div>

        <div class="video-info">

          <img
            class="channel-avatar"
            src="${video.avatar}"
            alt="${video.channel}"
          />

          <div class="video-details">

            <h3 class="video-title">
              ${video.title}
            </h3>

            <div class="channel-name">
              ${video.channel} ✓
            </div>

            <div class="video-stats">
              ${video.views} • ${video.time}
            </div>

          </div>

          <button class="more-btn">
            ⋮
          </button>

        </div>

      `;


      card.addEventListener("click", event => {

        if (event.target.classList.contains("more-btn")) {
          return;
        }

        modalImage.src = video.thumbnail;

        modal.classList.add("show");

      });


      videoGrid.appendChild(card);

    });


    if (filteredVideos.length === 0) {

      noResults.style.display = "block";

    } else {

      noResults.style.display = "none";

    }

  }


  /* SEARCH */

  searchInput.addEventListener("input", renderVideos);


  searchBtn.addEventListener("click", renderVideos);


  searchInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
      renderVideos();
    }

  });


  /* CATEGORIES */

  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.addEventListener("click", () => {

        document
          .querySelectorAll(".category")
          .forEach(btn => btn.classList.remove("active"));


        button.classList.add("active");


        selectedCategory =
          button.dataset.category;


        renderVideos();

      });

    });


  /* SIDEBAR */

  menuBtn.addEventListener("click", () => {

    if (window.innerWidth <= 700) {

      sidebar.classList.toggle("mobile-open");

    } else {

      sidebar.classList.toggle("collapsed");
      main.classList.toggle("expanded");

    }

  });


  /* DARK MODE */

  themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark");


    if (document.body.classList.contains("dark")) {

      themeBtn.textContent = "☀️";

    } else {

      themeBtn.textContent = "🌙";

    }

  });


  /* MODAL */

  closeModal.addEventListener("click", () => {

    modal.classList.remove("show");

  });


  modal.addEventListener("click", event => {

    if (event.target === modal) {

      modal.classList.remove("show");

    }

  });


  document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

      modal.classList.remove("show");

    }

  });


  /* INITIAL LOAD */

  renderVideos();

</script>

</body>
</html>
